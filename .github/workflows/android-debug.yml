name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: astra-custom

      - name: Apply Astra Custom v0.2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/astra-v02-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if marker not in workflow:
              raise SystemExit('v0.2 patch body not found')
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(body), 'astra-v02-patch', 'exec'))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        run: bash android/build.sh

      - name: Verify APK exists
        run: ls -lh android/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhangxinchuang-astra-custom-v02-debug-apk
          path: android/*.apk
          if-no-files-found: error

      - name: Commit tested v0.2 sources and clean staging files
        shell: bash
        run: |
          git config user.name "Astra Cat Engineering"
          git config user.email "actions@users.noreply.github.com"
          git checkout 58ca6049f02e9870446ca0a64ce24b09248d430f -- .github/workflows/android-debug.yml
          git rm .github/workflows/astra-v02-patch.yml
          if [ -f android/ASTRA_V02_TRIGGER.txt ]; then git rm android/ASTRA_V02_TRIGGER.txt; fi
          git add android/app/src/main/java/dev/linjian/peek/MainActivity.java \
                  android/app/src/main/java/dev/linjian/peek/ActivityEventStore.java \
                  android/app/src/main/res/layout/activity_main.xml \
                  .github/workflows/android-debug.yml
          git commit -m "feat(android): Astra Custom v0.2 local-first polish"
          git push origin HEAD:astra-custom
