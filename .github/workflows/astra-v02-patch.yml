name: Apply Astra Custom v0.2

on:
  push:
    branches:
      - astra-custom
    paths:
      - '.github/workflows/astra-v02-patch.yml'
      - '.github/scripts/apply_astra_v02.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout astra-custom
        uses: actions/checkout@v4
        with:
          ref: astra-custom

      - name: Apply v0.2 source patch
        run: python3 .github/scripts/apply_astra_v02.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build patched APK
        run: bash android/build.sh

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: zhangxinchuang-astra-custom-v02-debug-apk
          path: android/*.apk
          if-no-files-found: error

      - name: Commit v0.2 source changes
        shell: bash
        run: |
          git config user.name "Astra Cat Engineering"
          git config user.email "actions@users.noreply.github.com"
          git checkout 58ca6049f02e9870446ca0a64ce24b09248d430f -- .github/workflows/android-debug.yml
          git rm .github/workflows/astra-v02-patch.yml
          git rm .github/scripts/apply_astra_v02.py
          if [ -f android/ASTRA_V02_TRIGGER.txt ]; then git rm android/ASTRA_V02_TRIGGER.txt; fi
          git add android/app/src/main/java/dev/linjian/peek/MainActivity.java \
                  android/app/src/main/java/dev/linjian/peek/ActivityEventStore.java \
                  android/app/src/main/res/layout/activity_main.xml \
                  .github/workflows/android-debug.yml
          git commit -m "feat(android): Astra Custom v0.2 local-first polish"
          git push origin HEAD:astra-custom
